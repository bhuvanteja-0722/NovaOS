name: NovaOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc binutils nasm qemu-system-x86 grub-pc grub-pc-bin grub-common xorriso mtools

      - name: Build kernel and ISO
        run: make iso

      - name: Boot smoke test
        run: make smoke
